<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Corazón ASCII 3D - Dianita ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 42%, #260d2e 0%, #14061b 52%, #0a0310 100%);
      color: #fff5f8;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Nebulosa de fondo animada */
    .nebula-bg {
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 30% 30%, rgba(255, 77, 141, 0.22), transparent 45%),
        radial-gradient(circle at 72% 38%, rgba(168, 85, 247, 0.24), transparent 48%),
        radial-gradient(circle at 50% 75%, rgba(255, 209, 102, 0.12), transparent 50%);
      filter: blur(36px);
      animation: nebulaDrift 16s ease-in-out infinite alternate;
    }

    @keyframes nebulaDrift {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.08) translate(-2%, 2%); }
    }

    #ascii-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
      touch-action: none;
    }

    #ascii-canvas:active {
      cursor: grabbing;
    }

    /* HUD estilo terminal minimalista arriba */
    .terminal-hud {
      position: relative;
      z-index: 2;
      padding: calc(16px + env(safe-area-inset-top)) 20px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: rgba(255, 198, 220, 0.65);
      pointer-events: none;
      display: flex;
      justify-content: space-between;
    }

    /* Bloque inferior limpio y flotante */
    .bottom-cta {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 24px 24px calc(38px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(10, 3, 16, 0.92) 32%, rgba(10, 3, 16, 0) 100%);
      pointer-events: none;
    }

    .bottom-cta h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.75rem, 5vw, 2.3rem);
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 25%, #ff9ec4 75%, #ffd166 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 24px rgba(255, 77, 141, 0.3);
    }

    .bottom-cta p {
      font-size: 0.88rem;
      color: rgba(242, 220, 232, 0.82);
      margin-bottom: 18px;
      max-width: 360px;
      margin-inline: auto;
    }

    .btn-enter {
      pointer-events: auto;
      background: rgba(255, 77, 141, 0.22);
      border: 1px solid rgba(255, 150, 195, 0.7);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 13px 28px;
      border-radius: 99px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 28px rgba(255, 77, 141, 0.4), inset 0 0 12px rgba(255, 133, 179, 0.25);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-enter:hover {
      background: rgba(255, 77, 141, 0.36);
      box-shadow: 0 0 38px rgba(255, 77, 141, 0.7);
    }

    .btn-enter:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="nebula-bg"></div>
  <canvas id="ascii-canvas"></canvas>

  <div class="terminal-hud">
    <span>dianita_heart.py</span>
    <span id="hud-rot">rot: 0°</span>
  </div>

  <div class="bottom-cta">
    <h1>¡Feliz Cumpleaños, Dianita!</h1>
    <p>Hecho línea por línea para ti. Desliza para girarlo ✨</p>
    <button class="btn-enter" onclick="celebrate()">[ Abrir mi regalo 💖 ]</button>
  </div>

  <script>
    const mobile = matchMedia('(max-width: 700px)').matches || 'ontouchstart' in window;

    // Motor de sonido suave (Web Audio API)
    const Snd = (() => {
      let ctx;
      function init() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) ctx = new AC();
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
      }
      function tone(f, d = 0.35, v = 0.1, t = 0) {
        if (!ctx) return;
        const o = ctx.createOscillator(), g = ctx.createGain(), n = ctx.currentTime + t;
        o.type = 'sine';
        o.frequency.setValueAtTime(f, n);
        g.gain.setValueAtTime(0.0001, n);
        g.gain.exponentialRampToValueAtTime(v, n + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, n + d);
        o.connect(g).connect(ctx.destination);
        o.start(n);
        o.stop(n + d + 0.05);
      }
      return {
        sparkle() { init(); tone(1318, 0.22, 0.06, 0); tone(1760, 0.3, 0.05, 0.06); },
        open() { init(); [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.75, 0.09, i * 0.09)); }
      };
    })();

    // ==========================================================
    // RENDERER 3D ASCII DE NUBE DENSA + GUIRNALDAS DE LUZ
    // ==========================================================
    (() => {
      const canvas = document.getElementById('ascii-canvas');
      const ctx = canvas.getContext('2d');
      const hudRot = document.getElementById('hud-rot');

      const BODY_CHARS = ['.', ':', '+', '*', 'v', 'x', '%', '&', '#', 'W'];
      const LIGHT_CHARS = ['@', '#', '*', '+'];

      // Velocidad base lenta y elegante
      const BASE_SPEED = 0.0055;
      let W, H, rotY = 0, velY = BASE_SPEED, dragX = null;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.clientWidth;
        H = canvas.clientHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      // 1. Nube densa volumétrica de corazón 3D
      const particles = [];
      const TARGET_COUNT = mobile ? 1500 : 2600;

      let attempts = 0;
      while (particles.length < TARGET_COUNT && attempts < 120000) {
        attempts++;
        const x = (Math.random() * 2.6) - 1.3;
        const y = (Math.random() * 2.6) - 1.2;
        const z = (Math.random() * 1.8) - 0.9;

        const a = x * x + 2.25 * z * z + y * y - 1;
        const val = a * a * a - (x * x * y * y * y) - (0.1125 * z * z * y * y * y);

        if (val <= 0 && val > -0.22) {
          const len = Math.hypot(x, y, z * 1.5) || 1;
          particles.push({
            x: x,
            y: -y,
            z: z,
            nx: x / len,
            ny: -y / len,
            nz: (z * 1.5) / len,
            ch: BODY_CHARS[Math.floor(Math.random() * BODY_CHARS.length)],
            isRibbon: false,
            phase: Math.random() * 6.28
          });
        }
      }

      // 2. Espirales luminosas alrededor del corazón
      const RIBBON_COUNT = mobile ? 220 : 380;
      for (let i = 0; i < RIBBON_COUNT; i++) {
        const t = i / RIBBON_COUNT;
        const y = -1.05 + t * 2.15;
        const angle = t * Math.PI * 7;

        const profile = Math.sin(Math.min(1, Math.max(0, (y + 1.05) / 2.1)) * Math.PI);
        const rx = (0.35 + profile * 0.88) * 1.04;
        const rz = (0.22 + profile * 0.48) * 1.04;

        const jitter = () => (Math.random() - 0.5) * 0.05;
        const x = Math.cos(angle) * rx + jitter();
        const z = Math.sin(angle) * rz + jitter();

        particles.push({
          x: x,
          y: -y,
          z: z,
          nx: Math.cos(angle),
          ny: 0,
          nz: Math.sin(angle),
          ch: LIGHT_CHARS[i % LIGHT_CHARS.length],
          isRibbon: true,
          phase: t * 18
        });
      }

      // 3. Partículas y estrellas en el fondo
      const stars = Array.from({ length: mobile ? 110 : 200 }, () => ({
        x: Math.random(),
        y: Math.random(),
        speed: 0.00035 + Math.random() * 0.0009,
        drift: (Math.random() - 0.5) * 0.0003,
        ch: Math.random() > 0.7 ? '✦' : (Math.random() > 0.4 ? '+' : '·'),
        alpha: 0.2 + Math.random() * 0.55,
        phase: Math.random() * 6.28,
        tint: Math.random() > 0.5 ? '255, 195, 225' : '225, 195, 255'
      }));

      function render(time) {
        // Limpiamos el canvas dejando ver el degradado y la nebulosa CSS detrás
        ctx.clearRect(0, 0, W, H);

        const cx = W * 0.5;
        const cy = H * (mobile ? 0.43 : 0.45);
        const beat = 1 + Math.sin(time * 0.0032) * 0.028;
        const baseSize = Math.min(W, H) * (mobile ? 0.32 : 0.30) * beat;

        // Resplandor radial suave detrás del corazón
        const glow = ctx.createRadialGradient(cx, cy, baseSize * 0.1, cx, cy, baseSize * 1.45);
        glow.addColorStop(0, 'rgba(255, 77, 148, 0.24)');
        glow.addColorStop(0.55, 'rgba(168, 85, 247, 0.10)');
        glow.addColorStop(1, 'rgba(10, 3, 16, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx, cy, baseSize * 1.45, 0, Math.PI * 2);
        ctx.fill();

        const fontSize = mobile ? 9.5 : 11.5;
        ctx.font = `600 ${fontSize}px "JetBrains Mono", monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Dibujar estrellas y destellos flotando en el fondo
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.y += s.speed;
          s.x += s.drift;
          if (s.y > 1) { s.y = -0.02; s.x = Math.random(); }
          if (s.x < 0) s.x = 1;
          if (s.x > 1) s.x = 0;

          const twinkle = 0.65 + 0.35 * Math.sin(time * 0.0025 + s.phase);
          ctx.fillStyle = `rgba(${s.tint}, ${s.alpha * twinkle})`;
          ctx.fillText(s.ch, s.x * W, s.y * H);
        }

        // Actualizar rotación lenta
        rotY += velY;
        velY += (BASE_SPEED - velY) * 0.035;
        if (hudRot) {
          const deg = Math.round(((rotY * 180) / Math.PI) % 360);
          hudRot.textContent = `rot: ${(deg + 360) % 360}°`;
        }

        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);

        // Proyectar todos los puntos 3D
        const projected = new Array(particles.length);
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const rx = p.x * cosY - p.z * sinY;
          const rz = p.x * sinY + p.z * cosY;

          const rnx = p.nx * cosY - p.nz * sinY;
          const rnz = p.nx * sinY + p.nz * cosY;

          const fov = 3.2;
          const persp = fov / (fov - rz);

          projected[i] = {
            sx: cx + rx * baseSize * persp,
            sy: cy + p.y * baseSize * persp,
            z: rz,
            light: rnx * 0.25 - p.ny * 0.25 + rnz * 0.9,
            ch: p.ch,
            isRibbon: p.isRibbon,
            phase: p.phase
          };
        }

        projected.sort((a, b) => a.z - b.z);

        // Dibujar caracteres del corazón
        for (let i = 0; i < projected.length; i++) {
          const pt = projected[i];
          const depth = Math.max(0.18, Math.min(1, (pt.z + 1.1) / 2.2));

          if (pt.isRibbon) {
            const twinkle = 0.6 + 0.4 * Math.sin(time * 0.005 + pt.phase);
            ctx.fillStyle = `rgba(255, 224, 130, ${depth * twinkle})`;
            ctx.fillText(pt.ch, pt.sx, pt.sy);
          } else {
            if (pt.light > 0.58) {
              ctx.fillStyle = `rgba(255, 218, 235, ${0.5 + depth * 0.5})`;
            } else if (pt.light > 0.1) {
              ctx.fillStyle = `rgba(255, 82, 152, ${0.4 + depth * 0.58})`;
            } else {
              ctx.fillStyle = `rgba(155, 36, 98, ${0.28 + depth * 0.45})`;
            }
            ctx.fillText(pt.ch, pt.sx, pt.sy);
          }
        }

        requestAnimationFrame(render);
      }

      // Arrastrar suavemente con el dedo o mouse
      canvas.addEventListener('pointerdown', e => {
        dragX = e.clientX;
        velY = 0.022;
        Snd.sparkle();
      });
      window.addEventListener('pointermove', e => {
        if (dragX !== null) {
          const dx = e.clientX - dragX;
          rotY += dx * 0.007;
          velY = dx * 0.002;
          dragX = e.clientX;
        }
      });
      window.addEventListener('pointerup', () => { dragX = null; });

      requestAnimationFrame(render);
    })();

    function celebrate() {
      Snd.open();
      confetti({
        particleCount: 100,
        spread: 85,
        origin: { y: 0.65 },
        colors: ['#ff4d8d', '#ffb8d1', '#ffd166', '#ffffff']
      });
    }
  </script>
</body>
</html>
